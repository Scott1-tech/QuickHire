<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Drivers — FleetView</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/shell.css"/>
</head>
<body>

<div id="sidebar-root"></div>

<div id="app-shell">
  <div id="main-content">
    <div id="page-header-root"></div>

    <div class="page-content">
      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <div>
          <h1 style="font-size:20px;font-weight:800;color:var(--text-primary);margin:0 0 2px;">Drivers</h1>
          <p style="font-size:13px;color:var(--text-muted);margin:0;" id="driver-count-label">Loading…</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" id="export-btn">⬇ Export</button>
          <button class="btn-primary" id="add-driver-btn">+ Add Driver</button>
        </div>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:2px;margin-bottom:18px;border-bottom:2px solid var(--border);overflow-x:auto;" id="driver-tabs">
        <button class="driver-tab active" data-tab="active" style="padding:9px 18px;font-size:13.5px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:2px solid var(--primary);color:var(--primary);white-space:nowrap;margin-bottom:-2px;">Active</button>
        <button class="driver-tab" data-tab="company" style="padding:9px 18px;font-size:13.5px;font-weight:500;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);white-space:nowrap;margin-bottom:-2px;">Company</button>
        <button class="driver-tab" data-tab="owner-operator" style="padding:9px 18px;font-size:13.5px;font-weight:500;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);white-space:nowrap;margin-bottom:-2px;">Owner Operators</button>
        <button class="driver-tab" data-tab="inactive" style="padding:9px 18px;font-size:13.5px;font-weight:500;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);white-space:nowrap;margin-bottom:-2px;">Inactive</button>
        <button class="driver-tab" data-tab="terminated" style="padding:9px 18px;font-size:13.5px;font-weight:500;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);white-space:nowrap;margin-bottom:-2px;">Terminated</button>
        <button class="driver-tab" data-tab="archived" style="padding:9px 18px;font-size:13.5px;font-weight:500;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);white-space:nowrap;margin-bottom:-2px;">Archived</button>
      </div>

      <!-- Filters bar -->
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="driver-search" class="form-input" placeholder="Search drivers…" style="max-width:240px;">
        <select id="state-filter" class="form-input" style="max-width:140px;">
          <option value="">All states</option>
          <option value="TX">TX</option>
          <option value="FL">FL</option>
          <option value="GA">GA</option>
          <option value="CA">CA</option>
        </select>
        <select id="type-filter" class="form-input" style="max-width:160px;">
          <option value="">All types</option>
          <option value="company">Company</option>
          <option value="owner-operator">Owner Operator</option>
        </select>
      </div>

      <!-- Table -->
      <div class="card" style="overflow:hidden;">
        <table class="data-table" id="driver-table">
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" id="select-all-drivers" style="border-radius:4px;"/></th>
              <th>Driver Name</th>
              <th>Score</th>
              <th>License #</th>
              <th>State</th>
              <th>Status</th>
              <th>Type</th>
              <th>Vehicle</th>
              <th>Hire Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="driver-tbody"></tbody>
        </table>
        <div id="driver-empty" class="hidden" style="padding:48px;text-align:center;color:var(--text-muted);">
          <div style="font-size:32px;margin-bottom:10px;">🚚</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:4px;">No drivers found</div>
          <div style="font-size:13px;">Add your first driver to get started.</div>
        </div>
      </div>

      <!-- Pagination -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--text-muted);">
        <span id="pagination-label"></span>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="btn-secondary" style="padding:5px 12px;font-size:12px;" id="prev-page" disabled>← Prev</button>
          <span id="page-indicator" style="font-size:13px;font-weight:600;color:var(--text-primary);padding:0 8px;">1</span>
          <button class="btn-secondary" style="padding:5px 12px;font-size:12px;" id="next-page" disabled>Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Driver Modal -->
<div id="add-driver-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:520px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <h2 class="modal-title" style="margin:0;">Add Driver</h2>
      <button onclick="document.getElementById('add-driver-modal').classList.add('hidden')" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);">×</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div style="grid-column:1/-1;">
          <label class="form-label">Full Name *</label>
          <input id="d-name" class="form-input" placeholder="FIRST LAST"/>
        </div>
        <div>
          <label class="form-label">CDL License # *</label>
          <input id="d-license" class="form-input" placeholder="TX12345678"/>
        </div>
        <div>
          <label class="form-label">State</label>
          <select id="d-state" class="form-input">
            <option value="TX">TX</option><option value="FL">FL</option><option value="GA">GA</option>
            <option value="CA">CA</option><option value="NY">NY</option><option value="IL">IL</option>
          </select>
        </div>
        <div>
          <label class="form-label">Driver Type</label>
          <select id="d-type" class="form-input">
            <option value="company">Company Driver</option>
            <option value="owner-operator">Owner Operator</option>
          </select>
        </div>
        <div>
          <label class="form-label">Hire Date</label>
          <input id="d-hire" type="date" class="form-input"/>
        </div>
        <div style="grid-column:1/-1;">
          <label class="form-label">Vehicle / Unit</label>
          <input id="d-vehicle" class="form-input" placeholder="e.g. Peterbilt 389"/>
        </div>
        <div>
          <label class="form-label">Email</label>
          <input id="d-email" type="email" class="form-input" placeholder="driver@example.com"/>
        </div>
        <div>
          <label class="form-label">Phone</label>
          <input id="d-phone" type="tel" class="form-input" placeholder="+1 555-0100"/>
        </div>
      </div>
    </div>
    <div id="driver-modal-error" class="hidden" style="margin-top:12px;padding:10px 14px;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:8px;font-size:13px;color:#DC2626;"></div>
    <div style="display:flex;gap:10px;margin-top:22px;">
      <button class="btn-primary" style="flex:1;" id="driver-submit-btn">Add Driver</button>
      <button class="btn-secondary" onclick="document.getElementById('add-driver-modal').classList.add('hidden')">Cancel</button>
    </div>
  </div>
</div>

<script src="/shell.js"></script>
<script>
initShell('drivers-active');

const carrier = Shell.currentCarrier();
document.getElementById('page-header-root').innerHTML = renderPageHeader([
  { label: 'FleetView', href: '/dashboard.html' },
  { label: carrier.name, href: '/carrier-overview.html' },
  { label: 'Drivers' }
], `<button class="btn-primary" onclick="document.getElementById('add-driver-modal').classList.remove('hidden')">+ Add Driver</button>`);

// State
let allDrivers = [...MOCK_DRIVERS.filter(d => d.carrierId === Shell.currentCarrierId), ...MOCK_DRIVERS.filter(d => d.carrierId !== Shell.currentCarrierId)];
// Add some mock terminated/archived for demo
allDrivers.push(
  { id: 'd5', carrierId: 'c1', name: 'TONY REED', score: 65, license: 'TX55667788', state: 'TX', status: 'terminated', type: 'company', vehicle: '—', hireDate: '2020-05-01', isNew: false },
  { id: 'd6', carrierId: 'c1', name: 'BETTY CROSS', score: 72, license: 'TX99001122', state: 'TX', status: 'inactive', type: 'owner-operator', vehicle: 'Mack Anthem', hireDate: '2021-08-15', isNew: false }
);

let currentTab = 'active';
let currentPage = 1;
const PAGE_SIZE = 10;

function scoreColor(s) {
  if (s >= 90) return '#22C55E';
  if (s >= 75) return '#F59E0B';
  return '#EF4444';
}

function filterDrivers() {
  const q = document.getElementById('driver-search').value.toLowerCase();
  const state = document.getElementById('state-filter').value;
  const type = document.getElementById('type-filter').value;

  return allDrivers.filter(d => {
    const carrierId = Shell.currentCarrierId;
    if (d.carrierId !== carrierId) return false;
    // Tab filter
    if (currentTab === 'active' && d.status !== 'active') return false;
    if (currentTab === 'company' && (d.status !== 'active' || d.type !== 'company')) return false;
    if (currentTab === 'owner-operator' && (d.status !== 'active' || d.type !== 'owner-operator')) return false;
    if (currentTab === 'inactive' && d.status !== 'inactive') return false;
    if (currentTab === 'terminated' && d.status !== 'terminated') return false;
    if (currentTab === 'archived' && d.status !== 'archived') return false;
    // Search
    if (q && !d.name.toLowerCase().includes(q) && !d.license.toLowerCase().includes(q)) return false;
    if (state && d.state !== state) return false;
    if (type && d.type !== type) return false;
    return true;
  });
}

function renderDrivers() {
  const filtered = filterDrivers();
  const total = filtered.length;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('driver-count-label').textContent = `${total} driver${total !== 1 ? 's' : ''} for ${carrier.name}`;
  document.getElementById('pagination-label').textContent = total ? `Showing ${start+1}–${Math.min(start+PAGE_SIZE, total)} of ${total}` : '0 results';
  document.getElementById('page-indicator').textContent = currentPage;
  document.getElementById('prev-page').disabled = currentPage <= 1;
  document.getElementById('next-page').disabled = start + PAGE_SIZE >= total;

  if (!page.length) {
    document.getElementById('driver-table').style.display = 'none';
    document.getElementById('driver-empty').classList.remove('hidden');
    return;
  }
  document.getElementById('driver-table').style.display = '';
  document.getElementById('driver-empty').classList.add('hidden');

  document.getElementById('driver-tbody').innerHTML = page.map(d => `
    <tr>
      <td><input type="checkbox" class="driver-check" data-id="${d.id}" style="border-radius:4px;"/></td>
      <td>
        <div style="display:flex;align-items:center;gap:9px;">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;">${d.name[0]}</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--text-primary);">${d.name}</div>
            ${d.isNew ? '<span style="font-size:10px;font-weight:700;background:#EEF2FF;color:#6366F1;padding:1px 7px;border-radius:99px;">NEW</span>' : ''}
          </div>
        </div>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:32px;height:32px;border-radius:50%;border:2px solid ${scoreColor(d.score || 0)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${scoreColor(d.score || 0)};">${d.score || '—'}</div>
        </div>
      </td>
      <td style="font-family:monospace;font-size:13px;color:var(--text-secondary);">${d.license}</td>
      <td><span style="font-size:12.5px;font-weight:600;background:var(--border-light);padding:2px 8px;border-radius:6px;">${d.state}</span></td>
      <td>${stagePill(d.status)}</td>
      <td style="font-size:12.5px;color:var(--text-secondary);">${d.type === 'owner-operator' ? 'Owner Op.' : 'Company'}</td>
      <td style="font-size:12.5px;color:var(--text-secondary);">${d.vehicle || '—'}</td>
      <td style="font-size:12.5px;color:var(--text-muted);">${d.hireDate ? new Date(d.hireDate).toLocaleDateString() : '—'}</td>
      <td>
        <div style="display:flex;gap:4px;justify-content:flex-end;">
          <button class="btn-ghost" style="font-size:12px;" title="View driver">View</button>
          <button class="btn-ghost" style="font-size:12px;" title="More options">···</button>
        </div>
      </td>
    </tr>`).join('');
}

// Tab switching
document.querySelectorAll('.driver-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.driver-tab').forEach(b => {
      b.classList.remove('active');
      b.style.borderBottomColor = 'transparent';
      b.style.color = 'var(--text-muted)';
      b.style.fontWeight = '500';
    });
    btn.classList.add('active');
    btn.style.borderBottomColor = 'var(--primary)';
    btn.style.color = 'var(--primary)';
    btn.style.fontWeight = '600';
    currentTab = btn.dataset.tab;
    currentPage = 1;
    renderDrivers();
  });
});

document.getElementById('driver-search').addEventListener('input', () => { currentPage = 1; renderDrivers(); });
document.getElementById('state-filter').addEventListener('change', () => { currentPage = 1; renderDrivers(); });
document.getElementById('type-filter').addEventListener('change', () => { currentPage = 1; renderDrivers(); });
document.getElementById('prev-page').addEventListener('click', () => { currentPage--; renderDrivers(); });
document.getElementById('next-page').addEventListener('click', () => { currentPage++; renderDrivers(); });

// Add driver
document.getElementById('add-driver-btn').addEventListener('click', () => {
  document.getElementById('add-driver-modal').classList.remove('hidden');
});

document.getElementById('driver-submit-btn').addEventListener('click', () => {
  const name = document.getElementById('d-name').value.trim();
  const license = document.getElementById('d-license').value.trim();
  const errEl = document.getElementById('driver-modal-error');
  if (!name || !license) {
    errEl.textContent = 'Full name and license number are required.';
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');
  const newDriver = {
    id: 'd' + Date.now(),
    carrierId: Shell.currentCarrierId,
    name: name.toUpperCase(),
    score: Math.floor(Math.random() * 30 + 70),
    license: license.toUpperCase(),
    state: document.getElementById('d-state').value,
    status: 'active',
    type: document.getElementById('d-type').value,
    vehicle: document.getElementById('d-vehicle').value.trim() || '—',
    hireDate: document.getElementById('d-hire').value || new Date().toISOString().split('T')[0],
    isNew: true,
  };
  allDrivers.unshift(newDriver);
  MOCK_DRIVERS.unshift(newDriver);
  document.getElementById('add-driver-modal').classList.add('hidden');
  ['d-name','d-license','d-vehicle','d-email','d-phone'].forEach(id => { document.getElementById(id).value = ''; });
  renderDrivers();
});

document.getElementById('add-driver-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const filtered = filterDrivers();
  const csv = ['Name,License,State,Status,Type,Hire Date',
    ...filtered.map(d => `${d.name},${d.license},${d.state},${d.status},${d.type},${d.hireDate}`)
  ].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'drivers.csv';
  a.click();
});

// Select all
document.getElementById('select-all-drivers').addEventListener('change', e => {
  document.querySelectorAll('.driver-check').forEach(cb => cb.checked = e.target.checked);
});

onShellCarrierChange = () => renderDrivers();

renderDrivers();
</script>
</body>
</html>
