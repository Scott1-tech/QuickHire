<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hiring — FleetView</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/shell.css"/>
<style>
  .kanban { display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; align-items:flex-start; }
  .kcol { background:var(--bg); border:1px solid var(--border); border-radius:12px; min-width:248px; width:248px; flex-shrink:0; display:flex; flex-direction:column; max-height:calc(100vh - 220px); }
  .kcol-head { padding:12px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); position:sticky; top:0; }
  .kcol-count { font-size:11px; font-weight:700; background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:1px 8px; color:var(--text-muted); }
  .kcol-body { padding:10px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; min-height:60px; }
  .kcol-body.drag-over { background:var(--primary-light); border-radius:8px; }
  .kcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:grab; transition:box-shadow .15s, transform .1s; }
  .kcard:hover { box-shadow:var(--shadow); }
  .kcard.dragging { opacity:.5; transform:scale(.98); }
  .kcol-foot { padding:8px 12px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); }
  .stale { color:#DC2626; font-weight:700; }
  .view-tab { padding:6px 12px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--text-muted); }
  .view-tab.active { background:var(--primary-light); color:var(--primary); }
</style>
</head>
<body>

<div id="sidebar-root"></div>

<div id="app-shell">
  <div id="main-content">
    <div id="page-header-root"></div>

    <div class="page-content">
      <!-- Toolbar -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
        <div style="display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px;">
          <div class="view-tab active" data-view="board">▦ Board</div>
          <div class="view-tab" data-view="table">☰ Table</div>
        </div>
        <input id="search-input" placeholder="Search candidates…" style="flex:1;min-width:160px;max-width:280px;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"/>
        <select id="recruiter-filter" style="padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);">
          <option value="">All recruiters</option>
          <option>Fleet Admin</option>
        </select>
        <button id="export-btn" style="padding:8px 14px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);cursor:pointer;">Export</button>
        <button id="add-candidate-btn" style="padding:8px 16px;font-size:13px;font-weight:700;border:none;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;margin-left:auto;">＋ Add Candidate</button>
      </div>

      <!-- Board -->
      <div id="board-view"><div class="kanban" id="kanban"></div></div>

      <!-- Table -->
      <div id="table-view" style="display:none;">
        <div class="card" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid var(--border);">
              <th style="text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Name</th>
              <th style="text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Stage</th>
              <th style="text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Email</th>
              <th style="text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Time in stage</th>
            </tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Candidate modal -->
<div id="add-modal" class="hidden">
  <div class="modal-overlay" id="add-overlay">
    <div class="modal-box" style="max-width:440px;">
      <div style="font-size:17px;font-weight:800;color:var(--text-primary);margin-bottom:4px;">Add Candidate</div>
      <div id="modal-step-label" style="font-size:12px;color:var(--text-muted);margin-bottom:18px;">Step 1 of 2 — Choose company</div>

      <!-- Step 1: choose carrier -->
      <div id="modal-step1">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted);">Company (MC carrier) *</label>
        <select id="modal-carrier" style="width:100%;margin-top:6px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"></select>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px;">The candidate inherits this company's name, DOT/MC, pipeline, and document checklist. The application link is sent under this company.</div>
      </div>

      <!-- Step 2: details -->
      <div id="modal-step2" style="display:none;">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted);">Driver Name *</label>
        <input id="modal-name" style="width:100%;margin:6px 0 14px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"/>
        <label style="font-size:12px;font-weight:600;color:var(--text-muted);">Email *</label>
        <input id="modal-email" type="email" style="width:100%;margin:6px 0 14px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"/>
        <label style="font-size:12px;font-weight:600;color:var(--text-muted);">Phone (for SMS)</label>
        <input id="modal-phone" placeholder="+1…" style="width:100%;margin:6px 0 4px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"/>
        <div id="modal-msg" style="font-size:12.5px;margin-top:12px;"></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:22px;">
        <button id="modal-primary" style="flex:1;padding:11px;font-size:14px;font-weight:700;border:none;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;">Next</button>
        <button id="modal-cancel" style="padding:11px 18px;font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/shell.js"></script>
<script>
initShell('hiring');

function bc(){
  document.getElementById('page-header-root').innerHTML = renderPageHeader([
    { label:'Carriers', href:'/carriers.html' },
    { label: Shell.currentCarrier().name, href:'/carrier-overview.html' },
    { label:'Hiring' }
  ]);
}
bc();

const STAGES = ['Lead','Screening','Background Check','Offer','Onboarding'];
const STALE_HOURS = 48;

function visible(){
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  return Shell.candidates().filter(c => !q || c.name.toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q));
}

function cardHtml(c){
  const since = timeSince(c.stageEnteredAt);
  const isStale = (Date.now() - new Date(c.stageEnteredAt)) > STALE_HOURS*3600000;
  return `
  <div class="kcard" draggable="true" data-id="${c.id}">
    <div style="font-size:13.5px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.3px;">${c.name}</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin:4px 0 8px;">${c.email||''}</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="pill pill-pending" style="font-size:10px;">in_progress</span>
      <span style="font-size:11px;margin-left:auto;" class="${isStale?'stale':''}">⏱ ${since}</span>
    </div>
  </div>`;
}

function renderBoard(){
  const cands = visible();
  document.getElementById('kanban').innerHTML = STAGES.map(stage => {
    const inStage = cands.filter(c => c.stage === stage);
    return `
    <div class="kcol" data-stage="${stage}">
      <div class="kcol-head">${stagePill(stage)}<span class="kcol-count">${inStage.length}</span></div>
      <div class="kcol-body" data-stage="${stage}">${inStage.map(cardHtml).join('')}</div>
      <div class="kcol-foot">${inStage.length} candidate${inStage.length===1?'':'s'}</div>
    </div>`;
  }).join('');
  wireDnd();
}

function renderTable(){
  document.getElementById('table-body').innerHTML = visible().map(c => `
    <tr style="border-bottom:1px solid var(--border-light);">
      <td style="padding:12px 16px;font-size:13px;font-weight:700;color:var(--text-primary);text-transform:uppercase;">${c.name}</td>
      <td style="padding:12px 16px;">${stagePill(c.stage)}</td>
      <td style="padding:12px 16px;font-size:13px;color:var(--text-muted);">${c.email||''}</td>
      <td style="padding:12px 16px;font-size:12px;" class="${(Date.now()-new Date(c.stageEnteredAt))>STALE_HOURS*3600000?'stale':''}">${timeSince(c.stageEnteredAt)}</td>
    </tr>`).join('');
}

let dragId = null;
function wireDnd(){
  document.querySelectorAll('.kcard').forEach(card => {
    card.addEventListener('dragstart', () => { dragId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.kcol-body').forEach(body => {
    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', e => {
      e.preventDefault(); body.classList.remove('drag-over');
      const c = MOCK_CANDIDATES.find(x => x.id === dragId);
      if (c && c.stage !== body.dataset.stage){
        c.stage = body.dataset.stage;       // TODO: connect to API (PATCH stage + log timeline event)
        c.stageEnteredAt = new Date();
        renderBoard();
      }
    });
  });
}

function render(){ renderBoard(); renderTable(); }
render();

// View toggle
document.querySelectorAll('.view-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const board = t.dataset.view === 'board';
  document.getElementById('board-view').style.display = board ? '' : 'none';
  document.getElementById('table-view').style.display = board ? 'none' : '';
}));

document.getElementById('search-input').addEventListener('input', render);

document.getElementById('export-btn').addEventListener('click', () => {
  const rows = [['Name','Stage','Email','Time in stage'], ...visible().map(c => [c.name, c.stage, c.email||'', timeSince(c.stageEnteredAt)])];
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'candidates.csv'; a.click();
});

// Re-render on carrier switch
window.onShellCarrierChange = () => { bc(); render(); };

// ── Add Candidate flow (choose company first) ──
const modal = document.getElementById('add-modal');
let modalStep = 1;
function openModal(){
  modalStep = (Shell.role === 'Admin' || Shell.role === 'Owner') ? 1 : 2; // Super Admin chooses; recruiter auto-skips
  document.getElementById('modal-carrier').innerHTML = Shell.carriers().map(c => `<option value="${c.id}" ${c.id===Shell.currentCarrierId?'selected':''}>${c.name} · ${c.mc}</option>`).join('');
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-email').value = '';
  document.getElementById('modal-phone').value = '';
  document.getElementById('modal-msg').innerHTML = '';
  syncModal();
  modal.classList.remove('hidden');
}
function syncModal(){
  const s1 = modalStep === 1;
  document.getElementById('modal-step1').style.display = s1 ? '' : 'none';
  document.getElementById('modal-step2').style.display = s1 ? 'none' : '';
  document.getElementById('modal-step-label').textContent = s1 ? 'Step 1 of 2 — Choose company' : 'Step 2 of 2 — Candidate details';
  document.getElementById('modal-primary').textContent = s1 ? 'Next' : 'Add & Send Link';
}
function closeModal(){ modal.classList.add('hidden'); }

document.getElementById('add-candidate-btn').addEventListener('click', openModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('add-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

document.getElementById('modal-primary').addEventListener('click', async () => {
  if (modalStep === 1){
    Shell.currentCarrierId = document.getElementById('modal-carrier').value;
    bc(); render();
    modalStep = 2; syncModal(); return;
  }
  const name = document.getElementById('modal-name').value.trim();
  const email = document.getElementById('modal-email').value.trim();
  const phone = document.getElementById('modal-phone').value.trim();
  const msg = document.getElementById('modal-msg');
  if (!name || !email){ msg.style.color = '#DC2626'; msg.textContent = 'Name and email are required.'; return; }

  // Wire to existing backend; falls back to mock if API unavailable.
  try {
    const res = await fetch('/api/candidates', {
      method:'POST', headers:{'Content-Type':'application/json','x-admin-token': localStorage.getItem('qh_admin')||''},
      body: JSON.stringify({ name, email, phone, carrierId: Shell.currentCarrierId })
    });
    if (res.ok){
      const data = await res.json();
      msg.style.color = '#16A34A';
      msg.innerHTML = `Candidate added under <b>${Shell.currentCarrier().name}</b>.` + (data.link ? `<br><span style="color:var(--text-muted)">Link: ${data.link}</span>` : '');
    } else { throw new Error('api'); }
  } catch(_) {
    // mock fallback
    MOCK_CANDIDATES.push({ id:'p'+Date.now(), carrierId:Shell.currentCarrierId, name:name.toUpperCase(), email, phone, stage:'Lead', stageEnteredAt:new Date() });
    msg.style.color = '#16A34A';
    msg.textContent = `Candidate added under ${Shell.currentCarrier().name} (demo mode).`;
  }
  render();
  setTimeout(closeModal, 1400);
});
</script>
</body>
</html>
