<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>QuickHire — Hiring Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:{500:'#b01d30',600:'#8f1727',700:'#6f1220'},accent:{50:'#fef2f4',100:'#fde6e9',200:'#f7c4cc',500:'#b01d30',600:'#8f1727'}},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
<style>
body{font-family:'Inter',sans-serif;}
.board-col{min-height:200px;}
.card{cursor:grab;} .card:active{cursor:grabbing;}
.card.dragging{opacity:.4;}
.col-drop-target{outline:2px dashed #b01d30;outline-offset:2px;background:#fef2f4;}
.pill{display:inline-flex;align-items:center;padding:.2rem .65rem;border-radius:9999px;font-size:.75rem;font-weight:600;}
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<!-- Sticky header -->
<header class="sticky top-0 z-50 bg-white border-b border-gray-200">
  <div class="max-w-[1400px] mx-auto px-4 h-14 flex items-center gap-4">
    <!-- Breadcrumb -->
    <div class="text-sm text-gray-500 flex items-center gap-1.5 flex-shrink-0">
      <span class="hover:text-accent-600 cursor-pointer">Carriers</span>
      <span class="text-gray-300">›</span>
      <span id="bcCompany" class="hover:text-accent-600 cursor-pointer font-medium text-gray-700">NCX</span>
      <span class="text-gray-300">›</span>
      <span class="text-accent-600 font-semibold">Hiring</span>
    </div>
    <!-- Board/Table toggle -->
    <div class="inline-flex rounded-lg bg-gray-100 p-0.5 text-sm">
      <button id="toggleBoard" class="px-3 py-1.5 rounded-md font-medium bg-white shadow-sm text-gray-800">Board</button>
      <button id="toggleTable" class="px-3 py-1.5 rounded-md font-medium text-gray-500">Table</button>
    </div>
    <!-- Filters -->
    <div class="flex gap-2 text-xs flex-wrap">
      <button data-filter="" class="filter-btn px-2.5 py-1.5 rounded-lg bg-accent-500 text-white font-semibold">All</button>
      <button data-filter="stale" class="filter-btn px-2.5 py-1.5 rounded-lg bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200">Needs Follow-up</button>
      <button data-filter="docs_missing" class="filter-btn px-2.5 py-1.5 rounded-lg bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200">Docs Missing</button>
      <button data-filter="expiring" class="filter-btn px-2.5 py-1.5 rounded-lg bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200">Expiring Docs</button>
    </div>
    <div class="flex-1"></div>
    <!-- Search -->
    <input id="searchInput" placeholder="Search drivers…" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg w-44 focus:outline-none focus:border-accent-500"/>
    <!-- Recruiter filter (placeholder) -->
    <select id="recruiterFilter" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-accent-500">
      <option value="">All recruiters</option>
    </select>
    <button id="exportBtn" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg hover:bg-gray-50 font-medium">Export</button>
    <button id="addCandidateBtn" class="px-4 py-1.5 text-sm bg-accent-500 hover:bg-accent-600 text-white rounded-lg font-semibold">+ Add Candidate</button>
    <button id="logoutBtn" class="text-xs text-gray-400 hover:text-gray-700 ml-1">Sign out</button>
  </div>
</header>

<!-- Board view -->
<div id="boardView" class="max-w-[1400px] mx-auto px-4 py-5 overflow-x-auto">
  <div class="flex gap-4 min-w-max" id="boardCols"></div>
</div>

<!-- Table view -->
<div id="tableView" class="hidden max-w-[1400px] mx-auto px-4 py-5">
  <!-- Bulk actions bar -->
  <div id="bulkBar" class="hidden mb-3 flex items-center gap-3 bg-accent-50 border border-accent-200 rounded-xl px-4 py-2.5 text-sm">
    <span id="bulkCount" class="font-semibold text-accent-700"></span>
    <button data-bulk="resend" class="px-3 py-1.5 rounded-lg bg-accent-500 text-white font-semibold hover:bg-accent-600">Resend Links</button>
    <select id="bulkStageSelect" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm">
      <option value="">Change stage…</option>
    </select>
    <button data-bulk="stage" class="px-3 py-1.5 rounded-lg bg-gray-700 text-white font-semibold hover:bg-gray-800">Apply</button>
    <button id="bulkClear" class="ml-auto text-gray-500 hover:text-gray-700">✕ Clear</button>
  </div>
  <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-left border-b border-gray-200">
        <tr>
          <th class="px-4 py-3"><input type="checkbox" id="selectAll" class="rounded"/></th>
          <th class="px-4 py-3 font-semibold cursor-pointer hover:text-gray-800" data-sort="name">Name ↕</th>
          <th class="px-4 py-3 font-semibold">Stage</th>
          <th class="px-4 py-3 font-semibold">Status</th>
          <th class="px-4 py-3 font-semibold cursor-pointer hover:text-gray-800" data-sort="stageTime">Time in stage ↕</th>
          <th class="px-4 py-3 font-semibold">Recruiter</th>
          <th class="px-4 py-3 font-semibold cursor-pointer hover:text-gray-800" data-sort="createdAt">Added ↕</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Add Candidate modal -->
<div id="addModal" class="hidden fixed inset-0 z-[70] bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-bold">Add Candidate</h3>
      <button id="closeAddModal" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
    </div>
    <div class="space-y-3">
      <div><label class="block text-sm font-medium mb-1">Driver Name *</label>
        <input id="addName" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-accent-500 focus:ring-2 focus:ring-red-100 outline-none"/></div>
      <div><label class="block text-sm font-medium mb-1">Email *</label>
        <input id="addEmail" type="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-accent-500 focus:ring-2 focus:ring-red-100 outline-none"/></div>
      <div><label class="block text-sm font-medium mb-1">Phone (for SMS)</label>
        <input id="addPhone" type="tel" placeholder="+1…" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-accent-500 focus:ring-2 focus:ring-red-100 outline-none"/></div>
    </div>
    <div id="addDupWarning" class="hidden mt-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-800"></div>
    <div id="addResult" class="hidden mt-3 p-3 rounded-xl bg-green-50 border border-green-200 text-sm text-green-800"></div>
    <div class="flex gap-3 mt-5">
      <button id="addSubmitBtn" class="flex-1 py-3 bg-accent-500 hover:bg-accent-600 text-white rounded-xl font-semibold">Send Invite</button>
      <button id="addCancelBtn" class="px-5 py-3 border border-gray-200 rounded-xl font-medium hover:bg-gray-50">Cancel</button>
    </div>
  </div>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
