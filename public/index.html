<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickHire — Driver Workdeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { 50: '#fef2f4', 100: '#fde6e9', 300: '#f0879a', 500: '#b01d30', 600: '#8f1727', 700: '#6f1220' },
          accent: { 50: '#fef2f4', 200: '#f7c4cc', 400: '#d94e60', 500: '#b01d30', 600: '#8f1727', 700: '#6f1220' },
        },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Sticky top nav -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-accent-500 text-white font-extrabold flex items-center justify-center">Q</div>
        <div>
          <div class="font-bold leading-tight">QuickHire</div>
          <div class="text-xs text-gray-500 leading-tight" id="companyName">Driver Workdeck</div>
        </div>
      </div>
      <button id="logoutBtn" class="hidden text-sm font-semibold text-accent-600 hover:text-accent-700">Sign out</button>
    </div>
  </header>

  <!-- Login gate -->
  <div id="loginView" class="hidden max-w-md mx-auto px-4 mt-24">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-xl font-bold mb-1">Company sign in</h1>
      <p class="text-sm text-gray-500 mb-6">Enter the workdeck password to continue.</p>
      <input id="passwordInput" type="password" placeholder="Password"
        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-accent-200 focus:border-accent-500 outline-none mb-3" />
      <p id="loginError" class="text-sm text-red-600 mb-3 hidden">Incorrect password.</p>
      <button id="loginBtn" class="w-full px-6 py-3 bg-accent-500 hover:bg-accent-600 text-white rounded-xl font-semibold">Sign in</button>
    </div>
  </div>

  <!-- Main app -->
  <main id="appView" class="hidden max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="grid lg:grid-cols-3 gap-6">

      <!-- Invite a driver -->
      <section class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-lg font-bold mb-1">Invite a driver</h2>
          <p class="text-sm text-gray-500 mb-5">Send a secure application link by email (and SMS if a phone is provided).</p>
          <form id="inviteForm" class="space-y-3">
            <div>
              <label class="block text-sm font-medium mb-1">Driver name *</label>
              <input name="name" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-accent-200 focus:border-accent-500 outline-none" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Email *</label>
              <input name="email" type="email" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-accent-200 focus:border-accent-500 outline-none" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Phone (optional, for SMS)</label>
              <input name="phone" type="tel" placeholder="+1..." class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-accent-200 focus:border-accent-500 outline-none" />
            </div>
            <button type="submit" id="inviteBtn"
              class="w-full px-6 py-3 bg-accent-500 hover:bg-accent-600 text-white rounded-xl font-semibold transition-colors">
              Send invite
            </button>
          </form>
          <div id="inviteResult" class="hidden mt-4 p-4 rounded-xl bg-primary-50 border border-accent-200 text-sm">
            <p class="font-semibold text-accent-700 mb-1">Invite created</p>
            <p id="inviteStatus" class="text-gray-600 mb-2"></p>
            <label class="block text-xs font-medium text-gray-500 mb-1">Shareable link</label>
            <div class="flex gap-2">
              <input id="inviteLink" readonly class="flex-1 px-3 py-2 text-xs border border-gray-200 rounded-lg bg-white" />
              <button id="copyLink" class="px-3 py-2 text-xs font-semibold bg-gray-100 hover:bg-gray-200 rounded-lg">Copy</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Applications table -->
      <section class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
            <h2 class="text-lg font-bold">Applications</h2>
            <button id="refreshBtn" class="text-sm font-semibold text-accent-600 hover:text-accent-700">Refresh</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-gray-500 text-left">
                <tr>
                  <th class="px-6 py-3 font-semibold">Driver</th>
                  <th class="px-6 py-3 font-semibold">Email</th>
                  <th class="px-6 py-3 font-semibold">Status</th>
                  <th class="px-6 py-3 font-semibold">Updated</th>
                  <th class="px-6 py-3 font-semibold"></th>
                </tr>
              </thead>
              <tbody id="appsBody">
                <tr><td colspan="5" class="px-6 py-10 text-center text-gray-400">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Detail modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-[60] bg-black/50 flex items-start justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full my-8">
      <div class="sticky top-0 bg-white px-6 py-4 border-b border-gray-200 flex items-center justify-between rounded-t-2xl">
        <h3 class="text-lg font-bold" id="detailTitle">Application</h3>
        <button id="closeDetail" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
      </div>
      <div id="detailBody" class="p-6 space-y-6"></div>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
