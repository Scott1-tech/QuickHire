<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Inbox — FleetView</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/shell.css"/>
<style>
  .inbox-grid { display:grid; grid-template-columns:200px 320px 1fr; gap:0; height:calc(100vh - 130px); border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); }
  .inbox-rail { border-right:1px solid var(--border); padding:14px 10px; overflow-y:auto; background:var(--bg); }
  .inbox-list { border-right:1px solid var(--border); overflow-y:auto; }
  .rail-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--text-primary); cursor:pointer; }
  .rail-item:hover { background:var(--surface-hover); }
  .rail-item.active { background:var(--primary-light); color:var(--primary); font-weight:600; }
  .rail-label { font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin:16px 8px 6px; }
  .conv { display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-light); cursor:pointer; }
  .conv:hover { background:var(--surface-hover); }
  .filter-tab { padding:5px 11px; font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer; color:var(--text-muted); }
  .filter-tab.active { background:var(--primary-light); color:var(--primary); }
  @media(max-width:900px){ .inbox-grid{ grid-template-columns:1fr; } .inbox-rail,.inbox-list{ display:none; } }
</style>
</head>
<body>

<div id="sidebar-root"></div>

<div id="app-shell">
  <div id="main-content">
    <div id="page-header-root"></div>

    <div class="page-content">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <div style="display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:4px;">
          <div class="filter-tab active" data-filter="mine">Mine</div>
          <div class="filter-tab" data-filter="unassigned">Unassigned</div>
          <div class="filter-tab" data-filter="all">All <span style="opacity:.6">(4)</span></div>
        </div>
        <button id="settings-btn" style="margin-left:auto;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);cursor:pointer;">⚙ Inbox Settings</button>
      </div>

      <div class="inbox-grid">
        <!-- Left rail -->
        <div class="inbox-rail">
          <div class="rail-item active">📥 All conversations</div>
          <div class="rail-item">● Unreads</div>
          <div class="rail-item">⏳ Unattended</div>
          <div class="rail-item">🗄 Archived</div>

          <div class="rail-label">Labels</div>
          <div class="rail-item"><span style="color:#3B82F6">●</span> Driver</div>
          <div class="rail-item"><span style="color:#8B5CF6">●</span> Candidate</div>
          <div class="rail-item"><span style="color:#16A34A">●</span> Carrier</div>
          <div class="rail-item" style="color:var(--text-muted)">＋ Add label</div>

          <div class="rail-label">Contacts</div>
          <div class="rail-item">Carrier</div>
          <div class="rail-item">Driver</div>
          <div class="rail-item">Candidate</div>
          <div class="rail-item">Guest</div>
          <div class="rail-item">Blocked</div>
        </div>

        <!-- Conversation list -->
        <div class="inbox-list" id="conv-list"></div>

        <!-- Empty thread pane -->
        <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px;">
          <div style="font-size:40px;margin-bottom:12px;">💬</div>
          <div style="font-size:16px;font-weight:700;color:var(--text-primary);">Select a conversation</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">Choose a conversation from the list to start messaging.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Inbox settings modal -->
<div id="settings-modal" class="hidden">
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal-box" style="max-width:440px;">
      <div style="font-size:17px;font-weight:800;color:var(--text-primary);margin-bottom:18px;">Create inbox</div>
      <label style="font-size:12px;font-weight:600;color:var(--text-muted);">Carrier</label>
      <select id="settings-carrier" style="width:100%;margin:6px 0 16px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);"></select>

      <div style="display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:4px;margin-bottom:16px;">
        <div class="filter-tab active" style="flex:1;text-align:center;">📧 Email</div>
        <div class="filter-tab" style="flex:1;text-align:center;">📞 Phone</div>
      </div>

      <label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-primary);cursor:pointer;">
        <input type="checkbox" checked style="width:16px;height:16px;"/> Use system default configuration
      </label>

      <div style="display:flex;gap:10px;margin-top:22px;">
        <button id="settings-create" style="flex:1;padding:11px;font-size:14px;font-weight:700;border:none;border-radius:9px;background:var(--primary);color:#fff;cursor:pointer;">Create inbox</button>
        <button id="settings-cancel" style="padding:11px 18px;font-size:14px;font-weight:600;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/shell.js"></script>
<script>
initShell('inbox');

document.getElementById('page-header-root').innerHTML = renderPageHeader([
  { label:'FleetView', href:'/dashboard.html' },
  { label:'Inbox' }
]);

// Mock conversations (TODO: connect to API)
const channelIcon = { email:'📧', call:'📞', sms:'💬' };
const MOCK_CONVS = [
  { id:1, channel:'email', name:'ROBERT JOHNSON', preview:'Thanks, I just submitted my application…', time:'2h', pending:true, carrier:'GRAND ONE LLC', label:'Candidate' },
  { id:2, channel:'sms', name:'+1 (555) 010-2233', preview:'Got the link, filling it out now', time:'4h', pending:false, carrier:'GRAND ONE LLC', label:'Candidate' },
  { id:3, channel:'call', name:'MARIA GARCIA', preview:'Missed call · 3m', time:'1d', pending:false, carrier:'GRAND ONE LLC', label:'Driver' },
  { id:4, channel:'email', name:'TAYLOR TRANSPORTATION', preview:'Re: MC authority update', time:'2d', pending:false, carrier:'TAYLOR TRANSPORTATION', label:'Carrier' },
];

document.getElementById('conv-list').innerHTML = MOCK_CONVS.map(c => `
  <div class="conv">
    <div style="font-size:18px;flex-shrink:0;">${channelIcon[c.channel]}</div>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:13px;font-weight:700;color:var(--text-primary);">${c.name}</span>
        ${c.pending?'<span class="pill pill-pending" style="font-size:9px;">pending</span>':''}
        <span style="font-size:11px;color:var(--text-muted);margin-left:auto;">${c.time}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;">${c.preview}</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <span style="font-size:10.5px;color:var(--text-muted);">${c.carrier}</span>
        <span class="pill ${c.label==='Driver'?'pill-active':c.label==='Carrier'?'pill-complete':'pill-offer'}" style="font-size:9px;">${c.label}</span>
      </div>
    </div>
  </div>`).join('');

// Settings modal
const sm = document.getElementById('settings-modal');
document.getElementById('settings-carrier').innerHTML = Shell.carriers().map(c => `<option ${c.id===Shell.currentCarrierId?'selected':''}>${c.name}</option>`).join('');
document.getElementById('settings-btn').addEventListener('click', () => sm.classList.remove('hidden'));
document.getElementById('settings-cancel').addEventListener('click', () => sm.classList.add('hidden'));
document.getElementById('settings-create').addEventListener('click', () => sm.classList.add('hidden'));
document.getElementById('settings-overlay').addEventListener('click', e => { if (e.target===e.currentTarget) sm.classList.add('hidden'); });

document.querySelectorAll('.filter-tab[data-filter]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.filter-tab[data-filter]').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
}));

window.onShellCarrierChange = () => location.reload();
</script>
</body>
</html>
