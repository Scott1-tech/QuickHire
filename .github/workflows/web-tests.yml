name: web tests

# Runs the Vitest suite for the SPA (pure helpers: relative-time and clock
# formatting today, room to grow). Mirrors backend-tests.yml on the JS side.

on:
  pull_request:
  push:
    branches: [claude/zealous-ritchie-eoqtjc, claude/test-coverage-analysis-8qvwtu]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run Vitest
        working-directory: web
        run: npm run test
